name: ProofCI Check
description: Check that a pull request keeps its declared, Lean-proved guarantees about Rust (or, experimentally, TypeScript) code.
branding:
  icon: check-circle
  color: green

inputs:
  path:
    description: Directory (relative to the repository root) that contains proofci.yaml.
    default: "."
  image:
    description: >-
      Toolchain image. Leave empty to use the image published for the release or
      commit this action is pinned to (`uses: owner/proofci@v0.1.1` or
      `@<commit sha>`); set it to pin a digest explicitly.
    default: ""
  base:
    description: >-
      Override the commit whose policy is enforced. Leave empty in real use (the
      pull request base, merge-group base, or pushed commit is used). Only for
      testing an example whose policy is not yet on the base branch.
    default: ""
  token:
    description: Token used only to read pull request reviews when the policy changes.
    default: ${{ github.token }}
  artifact-name:
    description: Name of the uploaded report artifact. Set it when one job runs the action more than once.
    default: ""

outputs:
  passed:
    description: "'true' when every required guarantee is verified."
    value: ${{ steps.check.outputs.passed }}

runs:
  using: composite
  steps:
    - name: Select base and candidate commits
      id: refs
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        MQ_BASE: ${{ github.event.merge_group.base_sha }}
        MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        SHA: ${{ github.sha }}
        BASE_OVERRIDE: ${{ inputs.base }}
      run: |
        case "$EVENT" in
          pull_request|pull_request_target) base="$PR_BASE"; head="$PR_HEAD" ;;
          merge_group) base="$MQ_BASE"; head="$MQ_HEAD" ;;
          *) base="$SHA"; head="$SHA" ;;
        esac
        if [ -n "$BASE_OVERRIDE" ]; then
          echo "::warning::ProofCI base overridden to $BASE_OVERRIDE (testing only)."
          base="$BASE_OVERRIDE"
        fi
        if [ "$EVENT" = pull_request ]; then
          echo "::warning::ProofCI runs under 'pull_request', so the pull request controls this workflow. Use 'pull_request_target' to enforce the base branch policy."
        fi
        echo "base=$base" >> "$GITHUB_OUTPUT"
        echo "head=$head" >> "$GITHUB_OUTPUT"

    # Both commits are checked out as data: no credentials are persisted and
    # nothing from them is executed on the runner.
    - name: Check out the protected base
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ steps.refs.outputs.base }}
        path: .proofci/base
        persist-credentials: false
    - name: Check out the candidate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Pull requests from forks: fetch the commit from the fork itself.
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ steps.refs.outputs.head }}
        path: .proofci/head
        persist-credentials: false

    - name: Allow nested sandboxes on this disposable runner
      shell: bash
      run: sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true

    - name: Resolve, verify and pull the toolchain
      id: image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [ -n "$IMAGE" ]; then
          echo "::notice::Using the toolchain image given in the 'image' input ($IMAGE); its provenance is not checked."
          ref="$IMAGE"
        else
          if [[ "$ACTION_REF" =~ ^[0-9a-f]{40}$ ]]; then
            commit="$ACTION_REF"
          elif [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            commit=$(gh api "repos/$ACTION_REPOSITORY/commits/$ACTION_REF" --jq .sha)
          else
            echo "::error::Pin ProofCI to a release (uses: ${ACTION_REPOSITORY:-owner/proofci}@v0.1.1) or a commit SHA, or set the 'image' input."
            exit 1
          fi
          owner="${ACTION_REPOSITORY%%/*}"
          repo="ghcr.io/${owner,,}/proofci-toolchain"
          # Resolve the tag to an immutable digest once, verify that digest,
          # and from then on use only the digest.
          if ! digest=$(docker buildx imagetools inspect "$repo:$commit" --format '{{json .Manifest}}' \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])'); then
            echo "::error::No toolchain image is published for $ACTION_REPOSITORY@$commit (images exist for commits on its main branch)."
            exit 1
          fi
          # The signed provenance must say this digest was built by this
          # repository's CI workflow, from main, at exactly this commit.
          if ! gh attestation verify "oci://$repo@$digest" --repo "$ACTION_REPOSITORY" \
                --signer-workflow "$ACTION_REPOSITORY/.github/workflows/ci.yml" \
                --source-ref refs/heads/main --source-digest "$commit" >/dev/null; then
            echo "::error::The toolchain image $repo@$digest has no valid provenance for $ACTION_REPOSITORY@$commit; refusing to run it."
            exit 1
          fi
          echo "Verified provenance of $repo@$digest ($ACTION_REPOSITORY@$commit, CI workflow, main)"
          ref="$repo@$digest"
        fi
        start=$(date +%s)
        docker image inspect "$ref" >/dev/null 2>&1 || docker pull -q "$ref"
        echo "Pulled toolchain in $(( $(date +%s) - start ))s"
        echo "image=$ref" >> "$GITHUB_OUTPUT"
        echo "digest=$ref" >> "$GITHUB_OUTPUT"

    - name: Verify guarantees
      id: check
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.image }}
        IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        PROOFCI_PATH: ${{ inputs.path }}
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        HEAD_SHA: ${{ steps.refs.outputs.head }}
        REPOSITORY: ${{ github.repository }}
        API_URL: ${{ github.api_url }}
      run: python3 "$GITHUB_ACTION_PATH/action/run.py"

    - name: Keep the report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name || format('proofci-report-{0}-{1}-{2}', github.job, runner.arch, github.run_attempt) }}
        path: .proofci/out/
        if-no-files-found: ignore
