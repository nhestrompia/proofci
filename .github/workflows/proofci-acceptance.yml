name: ProofCI portable acceptance
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  acceptance:
    if: github.event.label.name == 'proofci-acceptance' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        scenario: [passing, unproven, error]
    runs-on: [self-hosted, linux, ARM64, proofci-acceptance-isolated]
    timeout-minutes: 15
    env:
      PROOFCI_TEST_PACKAGED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exercise pinned verifier and fixture snapshots
        run: python3 portable/test_github_example_linux.py
        env:
          PROOFCI_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/proofci-${{ github.run_id }}-${{ matrix.scenario }}
      - name: Return the selected public verification status
        run: |
          python3 -c 'import json, os, sys; x=json.load(open(os.path.join(os.environ["PROOFCI_ACCEPTANCE_OUTPUT"], "normalized.json"))); sys.exit(x[os.environ["SCENARIO"]]["exit"])'
        env:
          SCENARIO: ${{ matrix.scenario }}
          PROOFCI_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/proofci-${{ github.run_id }}-${{ matrix.scenario }}
      - name: Upload reports after all outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proofci-acceptance-${{ github.run_id }}-${{ matrix.scenario }}
          path: ${{ runner.temp }}/proofci-${{ github.run_id }}-${{ matrix.scenario }}/
          if-no-files-found: error
